name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cari folder project
        run: |
          SETTINGS=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts tidak ditemukan di repo!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project ditemukan di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TazkiaNightGuard-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
